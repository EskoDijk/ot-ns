# Static Thread dataset so this standalone device auto-joins the same
# network as light_output, without relying on OTNS's CLI-driven commissioning.
# Values must stay identical to light_output's board conf.
CONFIG_OPENTHREAD_PANID=0x1234
CONFIG_OPENTHREAD_XPANID="11:11:11:11:22:22:22:22"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="OtnsLightSwitch"
