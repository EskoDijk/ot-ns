# Increased main stack size required for initialization
CONFIG_MAIN_STACK_SIZE=4096

# LED output (native_sim defaults this off, unlike real boards)
CONFIG_GPIO=y

# Enable Networking and OpenThread stack
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y

# CoAP server (Zephyr's own CoAP API, not OpenThread's otCoap API)
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_COAP=y
CONFIG_COAP_SERVER=y

# Use NVS as settings backend
CONFIG_NVS=y

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Networking and OpenThread shells
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
